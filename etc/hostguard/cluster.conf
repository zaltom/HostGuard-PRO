###############################################################################
# HostGuard Pro - Cluster Members
# /etc/hostguard/cluster.conf
###############################################################################
# Addresses of the other HostGuard Pro servers to propagate blocks to, one per
# line. An address that attacks any member is then refused by all of them.
#
# Every member needs:
#
#   1. CLUSTER_ENABLE = "1" in hostguard.conf
#   2. The same secret in /etc/hostguard/cluster.key, mode 0600
#   3. Every other member listed here
#   4. CLUSTER_PORT reachable from the other members, and from nowhere else
#   5. Roughly synchronised clocks, because a message older than
#      CLUSTER_WINDOW is refused as a possible replay
#
# Generate the shared secret once and copy it to every member:
#
#   openssl rand -hex 32 > /etc/hostguard/cluster.key
#   chmod 600 /etc/hostguard/cluster.key
#
# Open the port to members only. Something like, on each member:
#
#   hostguard -a 203.0.113.10 "cluster member"
#
# and add a filter to allow.conf restricting the port to that address:
#
#   tcp|in|d=7654|s=203.0.113.10
#
# A member may be given its own key instead of using the shared secret:
#
#   203.0.113.11  key=<64 hex characters>
#
# What that buys is revocation. With one shared secret there is one thing to
# lose and no way to lose it in isolation: a member that is compromised holds
# the key every member uses, so recovering means generating a new secret and
# reaching every host in the group before any of them can talk again. With a
# key per member, the answer to a compromised member is to delete its line
# here. The member signs with whatever is in its own cluster.key, so its key
# goes in that file on that host and in this line on every other host.
#
# There is no falling back. A member named with a key is authenticated by that
# key alone - otherwise removing the line would leave it trusted through the
# shared secret, which is the opposite of the point.
#
# What it does not buy is protection from a member misbehaving while it is
# still trusted. A compromised member with a valid key can still ask every peer
# to block an address; CLUSTER_ACCEPT_ACTIONS and CLUSTER_MAX_PER_MINUTE in
# hostguard.conf are what bound that.
#
# Single addresses only - a CIDR range names many hosts and cannot be
# connected to. IPv4 and IPv6 members are both supported; a member is reached
# over whichever family its address belongs to, and the receiving host listens
# on the families named in CLUSTER_BIND.
#
# An IPv6 member is compared by address rather than by spelling, so
# 2001:db8::1 and 2001:0db8:0000:0000:0000:0000:0000:0001 are one member.
#
# Check the configuration with:  hostguard --cluster list
# Confirm members are reachable: hostguard --cluster ping
###############################################################################

# 203.0.113.10        # web01
# 203.0.113.11        # web02
# 198.51.100.20       # mail01
# 2001:db8::10        # web03, reached over IPv6
