###############################################################################
# HostGuard Pro - Main Configuration File
# /etc/hostguard/hostguard.conf
###############################################################################

###############################################################################
# SECTION: Initial Settings
###############################################################################

# Testing flag - enables a cron job that clears iptables rules after
# TESTING_INTERVAL minutes to prevent lockout during configuration.
# Set to 0 only after confirming the firewall works correctly.
# The daemon (hostguardd) will NOT start while TESTING = 1
TESTING = "1"

# Interval in minutes for the testing mode safety cron (1-60).
# A value outside that range, or one that is not a whole number, is refused
# and 5 is used instead - a malformed value would produce a crontab line cron
# rejects, and the safety net would silently not exist.
TESTING_INTERVAL = "5"

# Master switch. With ENABLED=0, "hostguard -e" leaves the firewall alone
# and "hostguard -r" stops it, so a host can be taken out of service
# without uninstalling or disabling the systemd units.
ENABLED = "1"

# Restrict editing of this file from the WHM interface.
#   0 = the WHM configuration editor can save changes
#   1 = the editor is read-only; change settings over SSH (default)
# The default is 1 because a bad value saved through a browser can lock you out
# of the server, with console access the only way back in. The allow, deny and
# ignore list editors in WHM are not affected by this setting.
RESTRICT_UI = "1"

###############################################################################
# SECTION: IPv4 Port Settings
###############################################################################
# Comma-separated port lists. Ranges use colon notation (e.g., 30000:35000)

# Stateful Packet Inspection (1=enabled, 0=static firewall fallback)
LF_SPI = "1"

# Allow incoming TCP ports
TCP_IN = "20,21,22,25,53,80,110,143,443,465,587,993,995,2077,2078,2079,2080,2082,2083,2086,2087,2095,2096,8443"

# Allow outgoing TCP ports
TCP_OUT = "20,21,22,25,37,43,53,80,110,113,443,587,873,993,995,2086,2087,2089"

# Allow incoming UDP ports
UDP_IN = "20,21,53,80,443"

# Allow outgoing UDP ports
UDP_OUT = "20,21,53,113,123,873,6277"

# Allow incoming PING (1=yes, 0=no)
ICMP_IN = "1"

# ICMP rate limit (e.g., "1/s", "0" to disable limiting)
ICMP_IN_RATE = "1/s"

# Allow outgoing PING (1=yes, 0=no)
ICMP_OUT = "1"

###############################################################################
# SECTION: IPv6 Port Settings
###############################################################################

# Enable IPv6 firewall support (requires ip6tables).
#
# With this at 0, IPv6 is not filtered AT ALL: no ip6tables chain is built or
# attached, so the default policy applies with no rules. Every port is
# reachable over IPv6 and no allowlist, denylist, block list, country rule or
# temporary block has any effect on it. If this host has a global IPv6 address,
# leaving this at 0 is a way around every control below.
#
# The installer sets this to 1 on a fresh install when the host has a global
# IPv6 address and ip6tables works, and the firewall logs an error on every
# start if the two disagree. Check TCP6_IN and UDP6_IN before disabling
# TESTING mode.
IPV6 = "0"

# IPv6 Stateful Packet Inspection
IPV6_SPI = "1"

# Allow incoming IPv6 TCP ports
TCP6_IN = "20,21,22,25,53,80,110,143,443,465,587,993,995,2077,2078,2082,2083,2086,2087,2095,2096,8443"

# Allow outgoing IPv6 TCP ports
TCP6_OUT = "20,21,22,25,37,43,53,80,110,113,443,587,873,993,995,2086,2087,2089"

# Allow incoming IPv6 UDP ports
UDP6_IN = "20,21,53,80,443"

# Allow outgoing IPv6 UDP ports
UDP6_OUT = "20,21,53,113,123,873,6277"

###############################################################################
# SECTION: General Settings
###############################################################################

# Network interface to filter (empty = all interfaces)
ETH_DEVICE = ""

# Network interfaces to skip, comma-separated (e.g., "docker0,veth+")
ETH_DEVICE_SKIP = ""

# Use conntrack module (1=conntrack, 0=deprecated state module)
USE_CONNTRACK = "1"

# Default policy for the FORWARD chain (DROP or ACCEPT).
# DROP suits a standalone server. Use ACCEPT where the host routes traffic for
# anything else - Docker or other containers, a VPN, or a NAT gateway - since
# forwarded traffic is otherwise silently dropped.
FORWARD_POLICY = "DROP"

# SSH port. This port is opened even when it is absent from TCP_IN, so an
# edit to the port list cannot cut off remote administration.
SSH_PORT = "22"

# Use ipset for large blocklists (1=yes, 0=no - falls back to individual rules)
LF_IPSET = "1"

# Drop mode for blocked packets
# DROP = silently drop, REJECT = send reject response
DROP_ACTION = "DROP"

# Log dropped packets (1=yes, 0=no)
DROP_LOGGING = "1"

# Maximum entries in the deny list (0=unlimited).
#
# Entries past this are NOT loaded into the firewall on a reload, even though
# they stay in deny.conf. Since the daemon promotes repeat offenders to
# permanent blocks automatically, a busy host passes this within weeks - so it
# is worth setting to what you actually want to hold. With ipset enabled the
# cost of a large list is a single hash lookup, and 0 is a reasonable choice.
# Whatever is being dropped is reported at every reload, by "hostguard -s" and
# on the WHM dashboard. Mark an entry that must always survive with a
# "do not delete" comment.
DENY_IP_LIMIT = "5000"

# Ceiling on active temporary blocks (0=unlimited). Once reached, the block
# closest to expiry is released to make room for a new one, one at a time and
# no more than ten in any five minutes. Past that rate nothing is released and
# the set is allowed over its ceiling: an ipset holds a million entries, so
# exceeding this briefly costs nothing, while a flood able to empty the table
# would let everything already blocked back in.
DENY_TEMP_IP_LIMIT = "20000"

###############################################################################
# SECTION: Login Failure Daemon Settings
###############################################################################

# Enable login failure detection daemon
LF_DAEMON = "1"

# Parse interval in seconds for checking new log entries
LF_PARSE_INTERVAL = "3"

# --- Per-service failure thresholds ---
# Format: number of failures to trigger a block
# Set to 0 to disable detection for that service

# SSH login failures
LF_SSHD = "5"

# FTP login failures (pure-ftpd, proftpd)
LF_FTPD = "10"

# POP3 login failures (dovecot)
LF_POP3D = "10"

# IMAP login failures (dovecot)
LF_IMAPD = "10"

# SMTP AUTH failures (exim)
LF_SMTPAUTH = "5"

# cPanel/WHM login failures
LF_CPANEL = "10"


# --- Timing ---

# Time window in seconds for counting failures (default: 3600 = 1 hour)
LF_INTERVAL = "3600"

# Cross-protocol aggregation: count failures across all services for one IP
# toward a single threshold (1=yes, 0=no, per-service only)
LF_GLOBAL_THRESHOLD = "1"

# Combined threshold if LF_GLOBAL_THRESHOLD=1
LF_GLOBAL_LIMIT = "15"

# --- Blocking ---

# Default temporary block duration in seconds (3600=1hr, 86400=1day).
#
# A whole number of seconds above zero, up to 2147483 (about 24 days),
# which is the longest timeout ipset can hold. Anything else is refused and
# the daemon falls back to 3600 with a warning in the log.
#
# Zero is not "forever": ipset reads a timeout of 0 as no timeout at all,
# which would make a temporary block permanent while still reporting it as
# expiring. Use deny.conf or a permanent block for that.
LF_TEMP_BLOCK_DURATION = "3600"

# Automatically promote to permanent block after this many temp blocks
# Set to 0 to disable auto-promotion
LF_PERM_BLOCK_AFTER = "3"

# Window, in seconds, within which repeat blocks count towards
# LF_PERM_BLOCK_AFTER (default 86400 = 24h). An address that offends outside
# this window starts its count again. Set to 0 to count repeats indefinitely,
# so that LF_PERM_BLOCK_AFTER blocks over any span at all trigger a permanent
# ban.
LF_PERM_BLOCK_INTERVAL = "86400"

# Send email alerts on blocks (1=yes, 0=no)
LF_EMAIL_ALERT = "1"

# Alert email recipient
LF_ALERT_TO = "root"

# Alert email from address
LF_ALERT_FROM = "hostguard@localhost"

# Most alert messages to send in one clock hour (0=unlimited). A
# distributed attack produces one block per source address, and this keeps
# that from flooding the mailbox and the local mail queue.
LF_ALERT_MAX_PER_HOUR = "20"

###############################################################################
# SECTION: Log Files to Monitor
###############################################################################

# Paths to log files that the daemon will tail
# The daemon auto-detects which files exist
LOG_SSHD = "/var/log/secure"
LOG_SSHD_ALT = "/var/log/auth.log"
LOG_FTPD = "/var/log/messages"
LOG_MAIL = "/var/log/maillog"
LOG_MAIL_ALT = "/var/log/mail.log"
LOG_CPANEL = "/usr/local/cpanel/logs/login_log"
LOG_CPANEL_ERROR = "/usr/local/cpanel/logs/error_log"

###############################################################################
# SECTION: Connection Limits
###############################################################################

# Connection tracking limit per IP (0=disabled)
# Format: "port;limit" - e.g. "22;5,80;50,443;50"
CONNLIMIT = "22;5,25;10"

# Port flood protection. Empty disables it.
# Format: "port;hits;interval;protocol" - e.g. "22;5;300;tcp" allows one source
# five new connections to port 22 in any 300 second window and drops the rest.
# Separate several rules with commas.
#
# The hit count must be 19 or lower: the kernel's recent module tracks a
# limited number of timestamps per address (ip_pkt_list_tot, 20 by default),
# and a higher count could never be reached.
PORTFLOOD = ""

# SYN flood protection (1=yes, 0=no)
SYNFLOOD = "0"

# SYN flood rate limit
SYNFLOOD_RATE = "100/s"

# SYN flood burst limit
SYNFLOOD_BURST = "150"

###############################################################################
# SECTION: External Block Lists
###############################################################################

# Apply the lists defined in /etc/hostguard/blocklists.conf (1=yes, 0=no).
# No list is enabled by default, so this makes no outbound requests until one
# is uncommented in that file.
BLOCKLIST_ENABLE = "1"

# Seconds to wait for a list download before giving up.
BLOCKLIST_TIMEOUT = "60"

# Largest download accepted, in bytes. A provider returning something far
# larger than expected is rejected rather than written to disk.
#
# Counted by HostGuard Pro as the bytes arrive, not left to the downloader.
# Neither can be trusted with it: wget has no option that bounds a single file,
# and curl's --max-filesize only acts on a size the server declares up front,
# so a response without Content-Length slips past it. A transfer that passes
# this limit is abandoned and its partial file removed.
#
# A transfer that is abandoned leaves a downloader still running, so it is
# signalled, escalated to SIGKILL if it will not leave, and collected - none
# of which is allowed to block the caller. On the daemon that caller is the
# main loop.
BLOCKLIST_MAX_SIZE = "20971520"

# How much of a downloaded file has to be addresses before it is believed to
# be an address list, as a percentage of the lines that carry content once
# comments are removed. A file below this is not applied and the copy already
# in place is kept.
#
# The check exists because "it parsed" is not the same as "it is a block list".
# A provider serving an error page, a status page or a lapsed-account notice can
# put an address at the start of a line, and without this check that is enough
# to replace tens of thousands of entries with the handful the page contained.
# Set to 0 to accept anything that yields an address.
BLOCKLIST_MIN_VALID_PERCENT = "50"

# How far a list may fall short of the copy it is replacing, as a percentage,
# before the update is refused as a suspected truncated download.
#
# A transfer cut short by a proxy or by a provider mid-outage arrives looking
# complete, and the fragment that did arrive parses perfectly well, so nothing
# else notices. Lists shorter than 100 entries are exempt, since a small list
# can legitimately halve. Run "hostguard -b force" to accept a fall that is
# genuine. Set to 100 to turn the check off.
BLOCKLIST_MAX_SHRINK_PERCENT = "60"

###############################################################################
# SECTION: Logging
###############################################################################

# Daemon log file path
LOG_FILE = "/var/log/hostguard/daemon.log"

# Log level (0=errors only, 1=normal, 2=verbose, 3=debug)
LOG_LEVEL = "1"

# Built-in log rotation size, in bytes. 0 disables it.
# The default is 0 because /etc/logrotate.d/hostguard rotates this log. Two
# rotators against one file compete to create daemon.log.1 and overwrite each
# other's archive. Set a byte count here only on a host without logrotate.
LOG_MAX_SIZE = "0"

###############################################################################
# SECTION: Advanced
###############################################################################

# Custom iptables binary path (empty = auto-detect)
IPTABLES = ""

# Custom ip6tables binary path (empty = auto-detect)
IP6TABLES = ""

# Custom ipset binary path (empty = auto-detect)
IPSET = ""

# Pre-firewall rules script (executed before main rules are applied)
# Must be executable. Leave empty to skip.
PRE_SCRIPT = ""

# Post-firewall rules script (executed after main rules are applied)
# Must be executable. Leave empty to skip.
POST_SCRIPT = ""

# Block report hook script (called when an IP is blocked)
# Receives arguments: IP REASON DURATION
# Leave empty to skip.
BLOCK_REPORT = ""

###############################################################################
# SECTION: Additional Login Failure Detection
###############################################################################
# Thresholds for the services added alongside the original six. A value of 0
# switches a service off entirely, and its patterns are then never tested.

# Failed logins against password protected web pages (Apache htpasswd)
LF_HTPASSWD = "0"

# ModSecurity rule violations, versions 1 and 2
LF_MODSEC = "0"

# Suhosin alerts
LF_SUHOSIN = "0"

# Distributed login failure detection.
#
# The per-address thresholds above cannot see an attack spread across many
# hosts: each source fails twice and looks like a user who mistyped. This
# counts distinct addresses attacking one account instead, and blocks the
# whole set once too many appear within the hour.
LF_DISTRIBUTED = "0"

# Distinct addresses attacking one account before the set is blocked
LF_DISTRIBUTED_LIMIT = "25"

###############################################################################
# SECTION: Tracking Table Limits
###############################################################################
# The daemon keeps what it has seen in memory, keyed by things the attacker
# chooses: a source address, or a user name copied out of a log line. Nothing
# stops one host from inventing a new user name on every attempt, so without a
# limit those tables grow for as long as an attack lasts, and a daemon killed
# for using too much memory blocks nothing at all.
#
# When a table is full the least recently seen entries are dropped, so a
# sustained attack keeps its place while one-shot noise is what goes. Reaching
# a limit is reported in the log; seeing it regularly means either a flood or a
# host busy enough to want a higher figure.

# Accounts tracked for distributed attack detection
LF_TRACK_MAX_ACCOUNTS = "2000"

# Addresses tracked for login failures, login rate and block history
LF_TRACK_MAX_ADDRESSES = "20000"

###############################################################################
# SECTION: Login Rate Tracking
###############################################################################

# Successful POP3/IMAP logins allowed from one address per hour.
#
# A mail client that authenticates hundreds of times an hour is misconfigured
# at best and testing credentials at worst. 0 disables the check.
LOGIN_RATE_LIMIT = "0"

# Report addresses over the limit
LOGIN_RATE_ALERT = "1"

# Block addresses over the limit rather than only reporting them.
# Leave at 0 until the normal rate for this host's clients is known.
LOGIN_RATE_BLOCK = "0"

###############################################################################
# SECTION: Notifications
###############################################################################
# Every notice HostGuard Pro sends passes through one engine with a master
# switch, an hourly ceiling and repeat suppression. The events that most need
# reporting arrive in floods, so these limits are what keep the reports
# readable.

# Master switch. With this off no mail is sent, whatever is set below.
NOTIFY_ENABLE = "1"

# Messages per hour, per kind of notice. 0 removes the ceiling.
NOTIFY_MAX_PER_HOUR = "20"

# Seconds before an identical notice may be sent again. 0 disables
# suppression, which on a busy host means a message per event.
NOTIFY_REPEAT_INTERVAL = "3600"

# Report every successful SSH login
NOTIFY_SSH_LOGIN = "0"

# Report su attempts, successful and failed
NOTIFY_SU_LOGIN = "0"

# Report root logins to WHM (cPanel hosts)
NOTIFY_WHM_ROOT = "0"

# Report changes to the account database: a changed shell, uid, home
# directory or password. The password itself is never stored or sent, only
# the fact that it changed.
NOTIFY_ACCOUNT_MOD = "0"

###############################################################################
# SECTION: Process Monitoring
###############################################################################

# Report processes matching a known exploit shape, running from a deleted
# binary, or running out of a world-writable directory. Nothing is ever
# terminated by this check.
PROC_SCAN = "0"

# Report suspicious processes by mail
PROC_ALERT = "1"

# Seconds between process checks
PROC_INTERVAL = "300"

# Ignore processes belonging to system accounts. Service accounts legitimately
# run many long-lived processes, and counting them puts a floor under every
# other account's numbers.
PROC_IGNORE_SYSTEM = "1"

# Report an account running more than this many processes. 0 disables.
PROC_USER_LIMIT = "0"
PROC_COUNT_ALERT = "1"

# Report processes over a resource ceiling
PROC_USAGE_CHECK = "0"
PROC_USAGE_ALERT = "1"

# Percent of one core, averaged over the process lifetime. 0 disables.
PROC_USAGE_CPU = "90"

# Resident memory in kilobytes. 0 disables.
PROC_USAGE_MEM = "1048576"

# Seconds a process must have been running before it is considered. Almost
# everything spikes at startup, and reporting those trains you to ignore the
# check.
PROC_USAGE_TIME = "300"

# Send SIGTERM to processes over the ceiling.
#
# Off by default, and deliberately so: a false positive that kills a process
# is worse than the report it replaced. HostGuard Pro never sends SIGKILL - a
# process that ignores SIGTERM is a decision for a person.
PROC_USAGE_KILL = "0"

###############################################################################
# SECTION: File Monitoring
###############################################################################

# Report executables, setuid files and scripts in /tmp, /var/tmp, /dev/shm and
# /run/shm. A payload has to land somewhere before it runs, and these are
# where it lands.
FILE_SCAN = "0"
FILE_ALERT = "1"

# Seconds between file scans
FILE_INTERVAL = "3600"

# Additional directories to scan, comma-separated
FILE_SCAN_DIRS = ""

# Entries examined per scan, so a large /tmp cannot make the check itself the
# load problem
FILE_SCAN_MAX = "5000"

# Report changes to the paths listed in watch.conf
WATCH_ENABLE = "0"
WATCH_ALERT = "1"
WATCH_INTERVAL = "300"

###############################################################################
# SECTION: Integrity Monitoring
###############################################################################
# Compares the system binaries against a recorded baseline and reports what
# changed. This is the last line of detection: by the time a binary has been
# replaced, everything earlier has already been got past.
#
# The first run after enabling records the baseline and reports nothing. A
# changed binary is expected after a package update; run
# "hostguard --integrity-reset" then, so the next check starts from the new
# state.

INTEGRITY_ENABLE = "0"
INTEGRITY_ALERT = "1"

# Seconds between checks. Daily is usually right: the check reads and digests
# every binary, and running it hourly costs far more than it finds.
INTEGRITY_INTERVAL = "86400"

# Directories to compare, comma-separated. Empty uses the built-in list:
# /bin /sbin /usr/bin /usr/sbin /usr/local/bin /usr/local/sbin
INTEGRITY_DIRS = ""

# Files above this size are compared by metadata alone rather than by content,
# in bytes. 0 digests every file regardless of size.
INTEGRITY_MAX_SIZE = "10485760"

# Files examined per run
INTEGRITY_MAX_FILES = "8000"

###############################################################################
# SECTION: Port Scan Detection
###############################################################################
# Counts arrivals that matched no open port. A real client connects to a port
# something is listening on; a scan sweeps ports that are closed, so this only
# ever sees traffic a scan produces.

SCAN_ENABLE = "0"
SCAN_ALERT = "1"

# Closed ports touched before the source is blocked
SCAN_LIMIT = "10"

# Seconds the count is measured over
SCAN_INTERVAL = "60"

# Seconds a scanning source is blocked for
SCAN_BLOCK_TIME = "3600"

###############################################################################
# SECTION: Bogon Filtering
###############################################################################
# Drops packets whose source address cannot legitimately arrive from the
# internet - documentation ranges, multicast, reserved space. Nothing routable
# can be behind such an address, so a packet claiming one is forged.

BOGON_ENABLE = "0"

# Also drop private ranges: 10/8, 172.16/12, 192.168/16 and carrier-grade NAT.
#
# Leave this at 0 on any host with an internal interface, a VPN, or container
# networking. Those ranges are entirely normal there, and filtering them will
# break traffic you rely on.
BOGON_PRIVATE = "0"

###############################################################################
# SECTION: Unused Addresses
###############################################################################

# Addresses the host holds but serves nothing on, comma-separated.
#
# Traffic to one of these is either a scan or a misconfiguration, and neither
# wants answering. Listed explicitly rather than discovered, because guessing
# which addresses are unused would eventually guess wrong and take a live site
# offline.
UNUSED_IPS = ""

###############################################################################
# SECTION: Country Filtering
###############################################################################
# Allows or denies traffic by the country an address is registered to, using
# published zone files cached under /var/lib/hostguard/geo/.
#
# GEO_ALLOW is a very sharp instrument: it drops everything the zone files do
# not account for, including addresses reassigned since publication. The
# allowlist still wins over both modes, and an allow mode whose zone files
# came back empty is refused rather than applied.

GEO_ENABLE = "0"

# Deny these countries, as ISO 3166-1 alpha-2 codes, comma-separated.
# Example: GEO_DENY = "CN,RU,KP"
GEO_DENY = ""

# Allow only these countries, denying everything else. Mutually exclusive with
# GEO_DENY; if both are set, GEO_DENY wins and this is ignored.
GEO_ALLOW = ""

# Seconds between zone refreshes. Values below 86400 are raised to it.
GEO_INTERVAL = "86400"

# Zone file sources. {CC} is replaced with the lower-case country code.
# Empty uses the built-in defaults.
GEO_SOURCE = ""
GEO_SOURCE6 = ""

# How far a country's range count may fall against the copy it replaces, as a
# percentage, before the download is refused as truncated (0 = no check).
#
# This matters more than it looks. A transfer cut short by a proxy, or a
# provider mid-outage, arrives looking complete and parses perfectly well - it
# is simply a fragment. Without this check the fragment replaced the full list,
# and in GEO_ALLOW mode that does not weaken a block: it drops the traffic the
# permitted country is allowed to send, including the administrator's.
#
# Countries with fewer than 100 ranges are exempt, since the percentage says
# little at that size. Run "hostguard -c force" to accept a smaller list
# deliberately.
GEO_MAX_SHRINK_PERCENT = "60"

###############################################################################
# SECTION: Block Notice Service
###############################################################################
# Answers blocked visitors with a page explaining what happened, instead of
# dropping their connection silently. A dropped packet looks the same as a
# server that is down, which costs a site with real users in support requests.
#
# Only cleartext HTTP can be answered: a TLS client expects a handshake and
# would report a certificate error rather than render a page, so HTTPS traffic
# from a blocked address is left to drop.
#
# The notice is served; the block still stands. Nothing here lets a visitor
# remove their own block.

NOTICE_ENABLE = "0"

# Port the responder listens on. Not 80: it is not a web server and must never
# compete with the real one.
NOTICE_PORT = "8899"

# Bind address for the notice responder.
#
# 127.0.0.1 is safe and does not work: a nat REDIRECT rewrites the destination
# to the address the packet arrived on, not to loopback, so a responder bound
# only to loopback never receives the redirected connection. Set this to the
# public address the redirected ports are served on, or to 0.0.0.0 - exposure
# is controlled by the redirect, which only sends addresses that are in the
# temporary block set.
NOTICE_BIND = "127.0.0.1"

# Ports whose traffic is redirected, comma-separated. HTTP only.
NOTICE_PORTS = "80"

# Contact shown on the built-in page. Leave empty for generic wording.
NOTICE_CONTACT = ""

# Path to a replacement page. [IP] is substituted with the visitor's address.
# Empty uses the built-in page.
NOTICE_FILE = ""

###############################################################################
# SECTION: Outbound Mail Tracking
###############################################################################
# Counts messages leaving the host per account and per sending script. A
# compromised site usually shows itself here first: the account is real, the
# credentials are real, and the only visible symptom is the volume.

RELAY_TRACK = "0"
RELAY_ALERT = "1"

# Messages one account may send per hour before it is reported. 0 disables.
RELAY_LIMIT = "100"

###############################################################################
# SECTION: Load Average
###############################################################################

# Report load that stays high, rather than load that spikes. A busy host
# spikes constantly - a backup, a queue run, an update - and alerting on that
# trains you to ignore the alert.
LOAD_ALERT = "0"

# One-minute load average considered high. 0 disables.
LOAD_LIMIT = "10"

# Seconds it must stay above the limit before a report is sent
LOAD_INTERVAL = "300"

###############################################################################
# SECTION: Security Check and Statistics
###############################################################################

# Run the security check daily and report anything above low severity.
# Run it on demand with "hostguard --security".
SECURITY_ALERT = "0"

# Sample load, CPU, memory and process counts once a minute for the graphs in
# the WHM interface. Roughly a day of samples is kept.
STATS_ENABLE = "1"

###############################################################################
# SECTION: Cluster
###############################################################################
# Propagates blocks between HostGuard Pro servers, so an address that attacks
# one member is refused by all of them.
#
# Members are listed in cluster.conf and share a secret held in cluster.key.
# Messages are authenticated with an HMAC over their contents; a host that
# cannot produce the secret cannot inject a block. Members need roughly
# synchronised clocks, because the replay window is measured against them.

CLUSTER_ENABLE = "0"

# Port members exchange messages on
CLUSTER_PORT = "7654"

# Addresses the listener binds to, comma-separated.
#
# One socket is opened per address, so a dual-stack host listens on both
# families by naming both. IPv4 and IPv6 members are equally supported.
#
# Defaults to loopback so the port has to be opened deliberately. Set this to
# the interface members reach each other on, and open CLUSTER_PORT to those
# members only - never to the internet.
#
# Examples:
#   CLUSTER_BIND = "203.0.113.10"                 one IPv4 interface
#   CLUSTER_BIND = "2001:db8::10"                 one IPv6 interface
#   CLUSTER_BIND = "203.0.113.10,2001:db8::10"    both
CLUSTER_BIND = "127.0.0.1"

# File holding the shared secret. Keep it mode 0600.
# Generate one with: openssl rand -hex 32 > /etc/hostguard/cluster.key
CLUSTER_KEY_FILE = "/etc/hostguard/cluster.key"

# Seconds a message stays valid, which bounds how long a captured one could be
# replayed. Members whose clocks differ by more than this cannot talk.
CLUSTER_WINDOW = "300"

# Seconds to wait when sending to a member.
#
# This bounds the broadcast as a whole, not each member in turn: every member
# is contacted at once, so a cluster with several hosts down costs one timeout
# rather than one per host. That matters because the caller is the daemon's
# main loop, and time spent here is time not spent reading the logs.
CLUSTER_TIMEOUT = "5"

# Connections a broadcast may have open at once. Members past the limit start
# as earlier ones finish, sharing the one CLUSTER_TIMEOUT deadline. Raising it
# on a large cluster costs file descriptors; lowering it to 1 restores the old
# one-at-a-time behaviour, and with it the per-member timeout cost.
CLUSTER_MAX_PARALLEL = "32"

# Report cluster actions received from other members
CLUSTER_ALERT = "0"

###############################################################################
# SECTION: Additional Log Files
###############################################################################

# Alternative FTP log, for a vsftpd that writes its own file
LOG_FTPD_ALT = "/var/log/vsftpd.log"

# Apache error log, for htpasswd and ModSecurity detection
LOG_APACHE_ERROR = "/usr/local/apache/logs/error_log"

# Dedicated ModSecurity audit log, if one is configured
LOG_MODSEC = ""

# Suhosin log, if it is written separately rather than to syslog
LOG_SUHOSIN = ""
