###############################################################################
# HostGuard Pro - Watched Paths
# /etc/hostguard/watch.conf
###############################################################################
# Files and directories to report changes to, one absolute path per line.
#
# A file is compared by size, mtime, mode, ownership and a content digest. A
# directory is compared by its immediate entries, so a file appearing in it or
# disappearing from it is reported; the tree below it is not walked.
#
# The first check after WATCH_ENABLE is turned on records a baseline and
# reports nothing, because everything would otherwise look new.
#
# Requires WATCH_ENABLE = "1" in hostguard.conf.
###############################################################################

# --- Examples. Remove the leading # to enable one. --------------------------

# Account and authentication files
#/etc/passwd
#/etc/shadow
#/etc/group
#/etc/sudoers

# Remote access configuration
#/etc/ssh/sshd_config
#/root/.ssh/authorized_keys

# Scheduled work, a common place for persistence to be installed
#/etc/crontab
#/etc/cron.d
#/var/spool/cron

# Name resolution and routing
#/etc/hosts
#/etc/resolv.conf

# Web server configuration
#/usr/local/apache/conf/httpd.conf
#/etc/nginx/nginx.conf

# A document root that should never change outside a deployment
#/var/www/html
