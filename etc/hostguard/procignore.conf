###############################################################################
# HostGuard Pro - Process and File Scan Exceptions
# /etc/hostguard/procignore.conf
###############################################################################
# Things the process and file checks should never report, one rule per line.
#
# Three kinds of rule:
#
#   username         a bare name. Every process owned by the account is
#                    ignored.
#   /path/prefix     an absolute path. A process whose executable starts with
#                    it is ignored, and so is any file under it.
#   cmd:substring    a fragment of a command line. Any process whose command
#                    line contains it is ignored.
#
# Use these sparingly. Each one is a place the checks will not look, and an
# exception written to silence a report you have not explained is how a real
# finding gets missed. Prefer a path or a command fragment over a whole
# account: an exception for a user hides everything that user ever runs,
# including whatever a compromise of that account would run.
#
# System accounts are already ignored when PROC_IGNORE_SYSTEM = "1".
###############################################################################

# --- Examples. Remove the leading # to enable one. --------------------------

# A backup agent that legitimately runs at high CPU for long periods
#/opt/backup/bin

# A monitoring tool that reads /dev/mem
#cmd:collectd

# A build server's compiler processes
#cmd:/usr/bin/cc1plus

# An application that keeps its own executables in /tmp by design
#/tmp/app-runtime
