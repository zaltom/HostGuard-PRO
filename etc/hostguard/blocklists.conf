###############################################################################
# HostGuard Pro - External Block Lists
# /etc/hostguard/blocklists.conf
###############################################################################
# Publicly published lists of hostile networks, downloaded on a schedule and
# blocked at the firewall.
#
# Format: NAME|INTERVAL|MAX|URL
#   NAME     : Alphanumeric, max 24 characters. Names the ipset holding the
#              list, so it must be unique.
#   INTERVAL : Refresh interval in seconds. Values below 3600 are raised to
#              3600 so providers are not polled excessively.
#   MAX      : Maximum addresses to import, or 0 for the whole list.
#              This also bounds memory: the daemon holds the parsed list while
#              it loads it, at roughly 220 bytes per address. A list of two
#              million addresses therefore needs about 400 MB, against the
#              MemoryMax in hostguardd.service. Cap MAX on a very large source,
#              or raise that ceiling to match.
#
#              There is a harder ceiling above that one. The ipsets these
#              lists are loaded into are created to hold a million entries, and
#              a cached list longer than that makes "ipset restore" abort -
#              which makes the slot incomplete, which makes the firewall refuse
#              to activate it. Failing closed there is right, but the oversized
#              copy is already on disk by then, so every later reload fails the
#              same way, including the one run to fix a lockout. A download
#              past the ceiling is now refused outright and the previous copy
#              kept; the examples below carry a MAX so it is not reached in the
#              first place.
#   URL      : https:// address of the list.
#
#              A plain http:// source is refused unless
#              BLOCKLIST_ALLOW_HTTP is set in hostguard.conf, because over
#              plain HTTP the reply comes from whoever is on the path and the
#              reply is what the firewall drops.
#
#              The address is resolved before it is fetched and refused if it
#              points anywhere but the public internet - loopback, a private
#              network, or link-local, where cloud instance metadata lives.
#              Redirects are followed up to four hops and every hop is checked
#              the same way, so a provider that has been taken over cannot
#              point this host's root process at a service inside it.
#
# Lines starting with # are disabled. Remove the # to enable one.
#
# Every list is disabled below, so nothing is downloaded until you choose a
# list. Downloads run as root: enable only sources you trust, and be aware
# that a large list blocks a large number of networks outright.
#
# The daemon refreshes lists that have fallen due and applies them without
# interrupting the firewall. To update immediately:
#
#   hostguard -b            update lists that are due
#   hostguard -b force      re-download every list
#
# Addresses in allow.conf always win, so allowlisting an address protects it
# from every list here. Cached copies live in /var/lib/hostguard/blocklists/.
###############################################################################

# Spamhaus DROP List
#SPAMDROP|86400|500000|https://www.spamhaus.org/drop/drop.txt

# Spamhaus EDROP List
#SPAMEDROP|86400|500000|https://www.spamhaus.org/drop/edrop.txt

# DShield.org Recommended Block List
#DSHIELD|86400|500000|https://www.dshield.org/block.txt

# Blocklist.de (last hour)
#BDE|3600|500000|https://api.blocklist.de/getlast.php?time=3600

# GreenSnow Hack List
#GREENSNOW|86400|500000|https://blocklist.greensnow.co/greensnow.txt
