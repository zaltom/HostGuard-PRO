###############################################################################
# HostGuard Pro - Custom Login Failure Patterns
# /etc/hostguard/patterns.conf
###############################################################################
# Watch a service HostGuard Pro does not know about, without changing any code.
#
# Format: NAME|LOGFILE|THRESHOLD|REGEX
#
#   NAME      : 1-24 letters, digits or underscores. Names the counter, and
#               appears in the log and in the block reason.
#   LOGFILE   : Absolute path to the file to read. The daemon opens it in
#               addition to the standard logs, and a pattern is only ever
#               tested against lines from the file it names.
#   THRESHOLD : Failures from one address before it is blocked.
#   REGEX     : Perl regular expression with at least one capture group. The
#               first group that validates as an IP address is taken as the
#               offender, so a pattern may capture a user name first.
#
# The expression is compiled when the daemon starts or reloads. One that does
# not compile is reported in the daemon log and skipped; the rest still load.
#
# Blocks from these patterns behave exactly like built-in ones: the allowlist
# and ignore list are honoured, repeat offenders are promoted, and the block
# expires after LF_TEMP_BLOCK_DURATION.
#
# After editing:  hostguard --restart-daemon
###############################################################################

# --- Examples. Remove the leading # and adjust the path to enable one. ------

# A web application logging its own failed logins
#WEBAPP|/var/www/html/logs/auth.log|5|Failed login attempt from (?<ip>[\d.]+)

# WordPress via a plugin that logs to the Apache error log
#WPLOGIN|/usr/local/apache/logs/error_log|5|wp-login failure.*client (?<ip>[\d.]+)

# Postfix SASL authentication failures, for a host running Postfix
#POSTFIX|/var/log/maillog|5|postfix/smtpd.*SASL \S+ authentication failed.*\[(?<ip>[\d.]+)\]

# Roundcube webmail
#ROUNDCUBE|/var/log/roundcube/errors|5|FAILED login for \S+ from (?<ip>[\d.]+)$

# A management panel that names the user before the address. This is the case
# the (?<ip>...) group exists for: without it the first capture that parses as
# an address wins, and the user name is chosen by whoever is logging in.
#PANEL|/var/log/panel.log|3|user=\S+ result=fail ip=(?<ip>[\d.]+)

# Note on writing an expression:
#
#   - Name the address group (?<ip>...). Without a name, HostGuard Pro falls
#     back to using whichever capture parses as an address first, and on an
#     authentication log the text before the address is usually supplied by
#     the client - a user name, a request path, a mail subject. Someone who
#     puts an address in that field then chooses which address you block.
#     A warning is logged at startup for any pattern that omits it.
#   - Put the address group against text your application writes, not against
#     text it copied from the request, and require whatever the application
#     writes after it - a bracket, a comma, the end of the line.
#   - Anchor it to something specific. A pattern matching any line with an
#     address in it will block your own monitoring.
#   - Test it before enabling it:
#       perl -ne 'print if /YOUR REGEX HERE/' /path/to/logfile
#   - Match the failure, not the attempt. Some applications log one line when
#     a login starts and another when it fails; matching the first counts
#     every successful login as a failure.
