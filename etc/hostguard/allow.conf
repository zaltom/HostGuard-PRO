###############################################################################
# HostGuard Pro - Allowed IP Addresses
# /etc/hostguard/allow.conf
###############################################################################
# IP addresses listed here will ALWAYS be allowed through the firewall.
# The allowlist has the highest priority - these IPs will never be blocked by
# the deny list, a temporary block, an external block list or a country rule.
#
# Format:
#   One IP or CIDR per line. Comments after # on the same line are supported.
#   Blank lines and lines starting with # are ignored.
#
# Advanced filtering (optional):
#   tcp/udp|in/out|s/d=port|s/d=ip
#   Example: tcp|in|d=22|s=192.168.1.0/24
#
#   An advanced filter here is an ACCEPT, and it sits above every block - so a
#   line with no source, such as "tcp|in|d=80", exempts that port from the deny
#   list, from temporary blocks and from the block lists entirely. Give one a
#   source unless that is what you mean. See "Advanced Filters and Precedence"
#   in guide.md for the full order.
#
# Include external files:
#   Include /path/to/file
#
# Examples:
#   192.168.1.100          # Office static IP
#   10.0.0.0/8             # Internal network
#   tcp|in|d=22|s=10.0.0.5 # SSH from specific host only
###############################################################################

# Loopback - always allow
127.0.0.1

# Include cPanel known-good IPs if file exists
# Include /etc/hostguard/cpanel.allow
